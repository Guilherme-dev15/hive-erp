name: CI / CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-nest-backend:
    name: Test NestJS Backend (Unit & E2E)
    runs-on: ubuntu-latest
    
    # Define os serviços em background necessários para os testes (Postgres)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: johndoe
          POSTGRES_PASSWORD: randompassword
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        # Aguarda até o banco estar pronto para receber conexões
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./nest-api
        run: npx prisma generate

      - name: Run Prisma Migrations
        working-directory: ./nest-api
        env:
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: npx prisma migrate deploy

      - name: Run Unit Tests (NestJS)
        working-directory: ./nest-api
        run: npm run test

      - name: Run E2E Tests (NestJS)
        working-directory: ./nest-api
        env:
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: npm run test:e2e -- --runInBand

      - name: Build NestJS serverless artifact
        run: npm run build:nest

      - name: Verify NestJS serverless artifact
        shell: bash
        run: test -f nest-api/dist/serverless.js

  test-react-frontend:
    name: Test React Frontend (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Root Contract Tests (Vitest)
        run: npm test -- --run

      - name: Run Admin Unit Tests (Vitest)
        working-directory: ./app-admin
        run: npm run test

      - name: Build Admin
        run: npm run build --workspace=app-admin

      - name: Build Catalog
        run: npm run build --workspace=app-catalogo

      - name: Verify Vercel package
        run: npm run build:vercel && node scripts/verify-vercel-package.mjs

      - name: Check stale catalog API host is absent from active source
        shell: bash
        run: '! grep -R "hiveerp-api.vercel.app" app-catalogo/src'

      - name: Check legacy catalog routes are absent from active source
        shell: bash
        run: '! grep -R -E "config-by-slug|products-public|config-public|categories-public" app-catalogo/src'

      - name: Check Vercel configuration
        run: node scripts/verify-vercel-package.mjs
