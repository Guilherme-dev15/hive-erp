name: CI / CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-nest-backend:
    name: Test NestJS Backend (Unit & E2E)
    runs-on: ubuntu-latest
    
    # Define os serviços em background necessários para os testes (Postgres)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: johndoe
          POSTGRES_PASSWORD: randompassword
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        # Aguarda até o banco estar pronto para receber conexões
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./nest-api
        run: npx prisma generate

      - name: Run Prisma Migrations
        working-directory: ./nest-api
        env:
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: npx prisma migrate deploy

      - name: Run Unit Tests (NestJS)
        working-directory: ./nest-api
        run: npm run test

      - name: Run E2E Tests (NestJS)
        working-directory: ./nest-api
        env:
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: npm run test:e2e -- --runInBand

  test-react-frontend:
    name: Test React Frontend (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests (Vitest)
        working-directory: ./app-admin
        run: npm run test
