name: Hive ERP CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Dependencies (API)
      run: npm install
      working-directory: ./api

    - name: Run Tests (API)
      run: npm test
      working-directory: ./api

    - name: Install Dependencies (app-admin)
      run: npm install
      working-directory: ./app-admin

    - name: Build (app-admin)
      run: npm run build
      working-directory: ./app-admin

    - name: Install Dependencies (app-catalogo)
      run: npm install
      working-directory: ./app-catalogo

    - name: Build (app-catalogo)
      run: npm run build
      working-directory: ./app-catalogo

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Deploy API to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      working-directory: ./api

    - name: Deploy app-admin to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      working-directory: ./app-admin

    - name: Deploy app-catalogo to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CATALOGO }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      working-directory: ./app-catalogo
